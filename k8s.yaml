apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishing-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phishing-api
  template:
    metadata:
      labels:
        app: phishing-api
    spec:
      containers:
        - name: phishing-api
          image: phishing-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: phishing-api-service
spec:
  type: NodePort
  selector:
    app: phishing-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30800